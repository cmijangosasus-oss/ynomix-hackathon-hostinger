<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Ilustración de página no encontrada de YnomiX</title>
  <desc id="d">Una moneda con una lupa sobre un camino punteado que sube entre barras de ahorro, en tonos verde azulado y naranja.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F5F4"/>
      <stop offset="1" stop-color="#FDFCFA"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F09A5E"/>
      <stop offset="1" stop-color="#E37A39"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <!-- círculos suaves de fondo -->
  <circle cx="1030" cy="150" r="190" fill="#1E5754" opacity="0.06"/>
  <circle cx="170" cy="660" r="150" fill="#E37A39" opacity="0.08"/>
  <!-- suelo -->
  <ellipse cx="600" cy="690" rx="470" ry="34" fill="#1E5754" opacity="0.10"/>
  <!-- barras de ahorro -->
  <g fill="#1E5754">
    <rect x="190" y="560" width="70" height="130" rx="14" opacity="0.30"/>
    <rect x="290" y="505" width="70" height="185" rx="14" opacity="0.45"/>
    <rect x="390" y="440" width="70" height="250" rx="14" opacity="0.65"/>
  </g>
  <!-- camino punteado que sube y se corta -->
  <path d="M 225 540 C 300 470, 360 430, 430 395 S 560 330, 640 300" fill="none" stroke="#1E5754" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
  <!-- moneda -->
  <g transform="translate(700 330)">
    <circle r="150" fill="#1E5754" opacity="0.12" transform="translate(10 18)"/>
    <circle r="150" fill="url(#coin)"/>
    <circle r="118" fill="none" stroke="#FDFCFA" stroke-width="8" opacity="0.85"/>
    <!-- signo de interrogación -->
    <path d="M -44 -38 C -44 -82, 44 -82, 44 -36 C 44 -8, 6 -8, 6 28" fill="none" stroke="#FDFCFA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="68" r="15" fill="#FDFCFA"/>
  </g>
  <!-- lupa -->
  <g transform="translate(850 470)">
    <circle r="82" fill="#FDFCFA" fill-opacity="0.35" stroke="#1E5754" stroke-width="16"/>
    <path d="M 58 58 L 128 128" stroke="#1E5754" stroke-width="22" stroke-linecap="round"/>
    <path d="M -48 -30 A 56 56 0 0 1 -6 -58" fill="none" stroke="#FDFCFA" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- chispas -->
  <g fill="#E37A39">
    <circle cx="520" cy="250" r="9"/>
    <circle cx="960" cy="250" r="7"/>
    <circle cx="1010" cy="620" r="9" opacity="0.6"/>
  </g>
  <g stroke="#1E5754" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M 905 225 l 0 28 M 891 239 l 28 0"/>
    <path d="M 300 330 l 0 22 M 289 341 l 22 0"/>
  </g>
</svg>
